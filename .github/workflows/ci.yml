name: VeriDoc CI/CD

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        env:
          DATABASE_URL: postgresql://veridoc_app_user:unit_placeholder@localhost:5432/veridoc
          AUDIT_HASH_SALT: veridoc_ci_unit_salt
        run: pnpm test:unit

      - name: Production build check
        env:
          NEXT_PHASE: phase-production-build
          DATABASE_URL: postgresql://veridoc_app_user:build_placeholder@localhost:5432/veridoc
          DIRECT_DATABASE_URL: postgresql://postgres:build_placeholder@localhost:5432/veridoc
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-at-least-32-bytes
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_STORAGE_BUCKET: veridoc-controlled-docs
          AUDIT_HASH_SALT: veridoc_ci_build_salt
        run: pnpm build

  integration:
    name: PostgreSQL Integration & RLS Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d veridoc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision veridoc_app_user (NOBYPASSRLS)
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const sql = postgres(process.env.DIRECT_DATABASE_URL, { prepare: false, max: 1 });
            await sql.unsafe(`
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '\''veridoc_app_user'\'') THEN
                  CREATE ROLE veridoc_app_user WITH LOGIN PASSWORD '\''veridoc_app_ci_password'\'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
                END IF;
              END $$;
              GRANT CONNECT ON DATABASE veridoc TO veridoc_app_user;
            `);
            await sql.end();
          '

      - name: Run database migrations
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
        run: pnpm db:migrate

      - name: Run integration test suite as veridoc_app_user
        env:
          DATABASE_URL: postgresql://veridoc_app_user:veridoc_app_ci_password@localhost:5432/veridoc
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          BETTER_AUTH_SECRET: ci-integration-secret-at-least-32-bytes
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_STORAGE_BUCKET: veridoc-controlled-docs
          AUDIT_HASH_SALT: veridoc_ci_integration_salt
        run: pnpm test:integration

  e2e:
    name: Playwright E2E (PR to main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: veridoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d veridoc"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision veridoc_app_user (NOBYPASSRLS)
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
        run: |
          node --input-type=module -e '
            import postgres from "postgres";
            const sql = postgres(process.env.DIRECT_DATABASE_URL, { prepare: false, max: 1 });
            await sql.unsafe(`
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '\''veridoc_app_user'\'') THEN
                  CREATE ROLE veridoc_app_user WITH LOGIN PASSWORD '\''veridoc_app_ci_password'\'' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
                END IF;
              END $$;
              GRANT CONNECT ON DATABASE veridoc TO veridoc_app_user;
            `);
            await sql.end();
          '

      - name: Run migrations and seed demo data
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          AUDIT_HASH_SALT: veridoc_ci_e2e_salt
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build application
        env:
          NEXT_PHASE: phase-production-build
          DATABASE_URL: postgresql://veridoc_app_user:veridoc_app_ci_password@localhost:5432/veridoc
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          BETTER_AUTH_SECRET: ci-e2e-secret-at-least-32-bytes
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_STORAGE_BUCKET: veridoc-controlled-docs
          AUDIT_HASH_SALT: veridoc_ci_e2e_salt
          ENABLE_DEMO_LOGIN: "true"
        run: pnpm build

      - name: Run Playwright E2E tests
        env:
          DATABASE_URL: postgresql://veridoc_app_user:veridoc_app_ci_password@localhost:5432/veridoc
          DIRECT_DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/veridoc
          BETTER_AUTH_SECRET: ci-e2e-secret-at-least-32-bytes
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          SUPABASE_STORAGE_BUCKET: veridoc-controlled-docs
          AUDIT_HASH_SALT: veridoc_ci_e2e_salt
          ENABLE_DEMO_LOGIN: "true"
        run: pnpm test:e2e

  deploy-gate:
    name: Pre-Deploy Migration Gate & Production Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pre-deploy migrations against production DIRECT_DATABASE_URL
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ -n "$DIRECT_DATABASE_URL" ]; then
            pnpm db:migrate
          else
            echo "DIRECT_DATABASE_URL not set; skipping pre-deploy migration"
          fi

      - name: Deploy production build to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
          else
            echo "VERCEL_TOKEN not set; skipping CLI deploy"
          fi
